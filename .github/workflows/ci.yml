name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: Validate database changes
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://app:app_password@localhost:5432/appdb?search_path=public&sslmode=disable

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Check trailing whitespace
        run: |
          if git grep -nI -E '[[:blank:]]$' -- .; then
            echo "Trailing whitespace found."
            exit 1
          fi

      - name: Set up Atlas
        uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0
        with:
          cloud-token: ${{ secrets.ATLAS_TOKEN }}

      - name: Show Atlas version
        run: atlas version

      - name: Validate migrations
        run: atlas migrate validate --env local

      - name: Validate desired schema
        run: atlas schema validate --env local

      - name: Test migrations
        run: |
          latest_version="$(find migrations -maxdepth 1 -name '*.sql' -printf '%f\n' | sort | tail -n 1 | cut -d_ -f1)"
          test -n "$latest_version"
          sed "s/__LATEST_MIGRATION__/$latest_version/" migrate.test.hcl > "$RUNNER_TEMP/migrate.test.hcl"
          atlas migrate test --env local "$RUNNER_TEMP/migrate.test.hcl"

      - name: Apply migrations to local PostgreSQL
        run: atlas migrate apply --env local

      - name: Confirm migration directory matches desired schema
        run: |
          diff="$(atlas schema diff \
            --from file://migrations \
            --to file://schema.sql \
            --dev-url "docker://postgres/16/dev?search_path=public" \
            --format '{{ sql . }}')"
          if [ -n "$diff" ]; then
            printf '%s\n' "$diff"
            echo "Migration directory does not match schema.sql." >&2
            exit 1
          fi
