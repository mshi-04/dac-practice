name: Deploy verification Aurora

on:
  workflow_run:
    workflows:
      - Publish Atlas Registry
    types:
      - completed
  workflow_dispatch:
    inputs:
      migration_tag:
        description: >-
          Atlas Registry に公開済みの immutable commit SHA tag (40桁の小文字16進数)。
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Apply published Atlas migration
    concurrency:
      group: aurora-verification-deploy
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'develop' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    environment: aurora-verification
    timeout-minutes: 45

    steps:
      - name: Resolve and validate migration tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MIGRATION_TAG: ${{ github.event.inputs.migration_tag }}
          AUTO_MIGRATION_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            migration_tag="$MANUAL_MIGRATION_TAG"
          else
            migration_tag="$AUTO_MIGRATION_TAG"
          fi
          if ! printf '%s' "$migration_tag" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "migration_tag must be a 40-character lowercase hex commit SHA." >&2
            exit 1
          fi
          echo "migration_tag=$migration_tag" >> "$GITHUB_OUTPUT"

      - name: Obtain AWS credentials through GitHub OIDC
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_REGION"
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')"
          credentials="$(aws sts assume-role-with-web-identity \
            --role-arn "$AWS_DEPLOY_ROLE_ARN" \
            --role-session-name "github-atlas-deploy-${{ github.run_id }}" \
            --web-identity-token "$token" \
            --duration-seconds 900 \
            --region "$AWS_REGION")"
          {
            echo "AWS_ACCESS_KEY_ID=$(jq -r '.Credentials.AccessKeyId' <<<"$credentials")"
            echo "AWS_SECRET_ACCESS_KEY=$(jq -r '.Credentials.SecretAccessKey' <<<"$credentials")"
            echo "AWS_SESSION_TOKEN=$(jq -r '.Credentials.SessionToken' <<<"$credentials")"
            echo "AWS_REGION=$AWS_REGION"
          } >> "$GITHUB_ENV"

      - name: Start VPC deployment build
        id: build
        env:
          CODEBUILD_PROJECT_NAME: ${{ vars.CODEBUILD_PROJECT_NAME }}
          MIGRATION_TAG: ${{ steps.tag.outputs.migration_tag }}
        run: |
          test -n "$CODEBUILD_PROJECT_NAME"
          build_id="$(aws codebuild start-build \
            --project-name "$CODEBUILD_PROJECT_NAME" \
            --environment-variables-override \
              "name=MIGRATION_TAG,value=$MIGRATION_TAG,type=PLAINTEXT" \
            --query 'build.id' \
            --output text)"
          echo "id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment result
        env:
          BUILD_ID: ${{ steps.build.outputs.id }}
        run: |
          for attempt in $(seq 1 240); do
            status="$(aws codebuild batch-get-builds --ids "$BUILD_ID" --query 'builds[0].buildStatus' --output text)"
            echo "CodeBuild status: $status"
            case "$status" in
              SUCCEEDED) exit 0 ;;
              FAILED|FAULT|STOPPED|TIMED_OUT) exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for CodeBuild." >&2
          exit 1
